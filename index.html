// ==== ربط الميكرو بكاع المجالات ====
let currentKatibDoc = null;
function katibFilter(){
  const q = document.getElementById('katibSearch').value.toLowerCase().trim();
  const grid = document.getElementById('katibGrid');
  if(!q){ grid.innerHTML='<p class="text-gray-400 text-xs text-center">كتب أو هضر بالميكرو...</p>'; return; }
  let all=[];
  Object.keys(KATIB_LIB).forEach(dom=>{ KATIB_LIB[dom].forEach(d=> all.push({...d, domain:dom})); });
  const filtered = all.filter(d=> d.title.toLowerCase().includes(q) || d.content.toLowerCase().includes(q) || q.split(' ').some(w=> d.title.includes(w)) );
  if(filtered.length===0){ grid.innerHTML='<p class="text-red-400 text-xs text-center">ما لقيتش، جرب كلمة أخرى: كراء، نفقة، نصب...</p>'; return; }
  grid.innerHTML = filtered.slice(0,20).map((d,i)=>`
    <div class="flex justify-between items-center bg-[#FFFBF5] border rounded-xl p-3 cursor-pointer hover:bg-black hover:text-white" onclick="katibOpen('${d.domain}', \`${d.title.replace(/`/g,'')}\`)">
      <div><p class="font-black text-xs">${d.title}</p><p class="text-[10px] opacity-60">${d.domain} • جاهز للطبع بلا تاريخ</p></div>
      <span class="bg-black text-white text-[10px] px-2 py-1 rounded-full">📄</span>
    </div>
  `).join('');
}
function katibOpen(domain, title){
  const doc = KATIB_LIB[domain].find(d=>d.title===title);
  if(!doc) return;
  currentKatibDoc = doc;
  document.getElementById('katibPreview').classList.remove('hidden');
  document.getElementById('katibActions').classList.remove('hidden');
  document.getElementById('katibPreview').innerText = doc.content;
  document.getElementById('katibPreview').scrollIntoView({behavior:'smooth'});
}
function katibSpeakSearch(){
  if(!('webkitSpeechRecognition' in window) &&!('SpeechRecognition' in window)){ alert('استعمل Chrome'); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang='ar-MA';
  document.getElementById('katibSearch').placeholder='🎙️ كنسمع... قول: بغيت عقد كراء...';
  rec.onresult = (e)=>{
    const t = e.results[0][0].transcript;
    document.getElementById('katibSearch').value = t;
    katibFilter();
    // قلب تلقائي فالمكتبة القديمة حتى هي
    const oldSearch = document.getElementById('docSearch');
    if(oldSearch){ oldSearch.value=t; oldSearch.dispatchEvent(new Event('input')); }
    if(typeof filterDocs==='function') filterDocs();
    // إلا لقينا نتيجة نفتحو أول واحدة تلقائيا
    setTimeout(()=>{
      const first = document.querySelector('#katibGrid div');
      if(first) first.click();
    },300);
  };
  rec.start();
}
function katibPrint(){ if(!currentKatibDoc) return; const w=window.open('','_blank'); w.document.write('<pre style="font-family:Tajawal; white-space:pre-wrap; padding:20px; font-weight:bold; line-height:2">'+document.getElementById('katibPreview').innerText+'</pre>'); w.print(); }
function katibShare(){ if(!currentKatibDoc) return; const t=document.getElementById('katibPreview').innerText; if(navigator.share) navigator.share({title:currentKatibDoc.title, text:t}); else { navigator.clipboard.writeText(t); alert('تنسخ ✓'); } }

// ربط الميكرو الأصلي ديالك بالمكتبة الجديدة تلقائيا
(function(){
  const origShow = window.showTranscription;
  window.showTranscription = function(t){
    if(origShow) origShow(t);
    // قلب تلقائي فمكتبة الكاتب العمومي
    document.getElementById('katibSearch').value = t;
    katibFilter();
    // إلا كان شي كلمة مفتاحية نفتحو النموذج تلقائيا
    let lower = t.toLowerCase();
    if(lower.includes('كراء')) katibOpen('rent', KATIB_LIB.rent[0].title);
    else if(lower.includes('نفقة')) katibOpen('family', KATIB_LIB.family[0].title);
    else if(lower.includes('نصب')||lower.includes('فلوس')) katibOpen('scam', KATIB_LIB.scam[0].title);
    else if(lower.includes('ارض')||lower.includes('ورث')) katibOpen('land', KATIB_LIB.land[0].title);
    else if(lower.includes('خدمة')||lower.includes('طرد')) katibOpen('work', KATIB_LIB.work[0].title);
    else if(lower.includes('ادارة')||lower.includes('ورقة')) katibOpen('admin', KATIB_LIB.admin[0].title);
  };
  // عرض أولي
  setTimeout(()=>{ document.getElementById('katibGrid').innerHTML='<p class="text-gray-400 text-xs text-center">هضر بالميكرو الفوق فالصفحة الرئيسية وغنجيب لك النموذج هنا تلقائيا - 90 نموذج واجد</p>'; },500);
})();
</script>
