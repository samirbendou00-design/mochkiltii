<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة النماذج</title><style>body{font-family:Tahoma;background:#FFF8F0;margin:0;padding:12px}.h{background:#C1272D;color:#fff;padding:15px;border-radius:15px;text-align:center}.s{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;margin:12px 0}.c{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}.b{color:#C1272D;border:1px solid #C1272D;padding:8px 16px;border-radius:20px;text-decoration:none;font-weight:bold}.v{position:fixed;top:0;left:0;width:100%;height:100%;background:#eee;z-index:9999;display:none;overflow:auto}.p{background:#fff;max-width:800px;margin:20px auto;padding:30px;border-radius:10px;line-height:2.3}</style></head><body><div class="h"><h3 style="margin:0">📄 مكتبة النماذج - بالأسلوب القانوني</h3><a href="index.html" style="color:#fff">⬅️ رجوع</a></div><input id="q" class="s" placeholder="🔍 قلب..." oninput="R()"><div id="L"></div><div id="V" class="v"><div style="padding:12px;background:#fff;position:sticky;top:0;display:flex;gap:8px"><button onclick="V.style.display='none'" style="flex:1;padding:12px;border-radius:10px">اغلاق</button><button onclick="window.print()" style="flex:1;padding:12px;background:#C1272D;color:#fff;border:none;border-radius:10px">طباعة</button></div><div id="P" class="p"></div></div><script>
var D=[];
D.push({t:"1- طلاق - صياغة قانونية محترفة - مواد 78-93",c:"أسرة",h:'<h2>طلب توضيح مفهوم الطلاق</h2><p>الى السيد رئيس قسم قضاء الاسرة ب: ____</p><p><b>سلام تام بوجود مولانا الامام</b></p><p>يشرفني ان اعرض: حيث ان مدونة الاسرة القانون 70.03 نظمت الطلاق في المواد 78 الى 93.</p><p><b>المادة 78:</b> "الطلاق حل ميثاق الزوجية، يمارسه الزوج والزوجة كل بحسب شروطه تحت مراقبة القضاء وطبقا لاحكام هذه المدونة".</p><p><b>الانواع - مواد 122-126:</b><br>1- رجعي م123: يحق للزوج مراجعة زوجته داخل العدة بدون عقد جديد.<br>2- بائن بينونة صغرى م122: ينهي الزواج ولا تحل الا بعقد جديد.<br>3- بائن بينونة كبرى م126: المكمل للثلاث فلا تحل حتى تنكح زوجا غيره.</p><p><b>المسطرة م79 وما بعدها:</b><br>1- طلب الاذن بالاشهاد مرفقا بعقد الزواج.<br>2- استدعاء الطرف ومحاولة الصلح وجوبا م82 عبر حكمين او مجلس العائلة.<br>3- اذا تعذر الصلح تأذن المحكمة بالاشهاد وتحدد المستحقات م84 و85 (عدة، متعة، نفقة، سكن).<br>4- الاشهاد عند عدلين داخل 15 يوم تحت طائلة السقوط.</p><p><b>الاثار:</b> العدة م129، المتعة م84، الحضانة والنفقة م168 و180.</p><p>لاجله التمس توضيح الوثائق.<br>الاسم: ____ البطاقة: ____ التوقيع: ____ بتاريخ: ____</p>'});
D.push({t:"2- كراء شقة - صياغة قانونية - قانون 67.12",c:"كراء",h:'<h2>عقد كراء شقة سكنية - القانون 67.12</h2><p><b>الحمد لله وحده</b></p><p>بتاريخ: ____ بمدينة: ____</p><p><b>المكري:</b> السيد ____ بطاقة ____</p><p><b>المكتري:</b> السيد ____ بطاقة ____</p><p><b>الديباجة:</b> حيث ان الطرف الاول يملك الشقة ب ____ وحيث رغب الطرف الثاني في كرائها للسكن طبقا للقانون 67.12، اتفقا وهما بكامل الاهلية على ما يلي:</p><p><b>البند1 موضوع الكراء:</b> شقة بالطابق ____ مساحة ____ مكونة من ____</p><p><b>البند2 المدة:</b> من ____ الى ____ قابلة للتجديد باتفاق صريح.</p><p><b>البند3 الثمن:</b> ____ درهم شهريا مع تسبيق ضمان ____ طبقا للمادة 6 من القانون 67.12.</p><p><b>البند4 التزامات المكتري م12 و13:</b> اداء الوجيبة، المحافظة، اداء فواتير الماء والكهرباء، عدم التغيير الا باذن كتابي.</p><p><b>البند5 التزامات المكري م9:</b> تسليم الشقة صالحة للسكنى والاصلاحات الكبرى.</p><p><b>البند6 الفسخ:</b> بعد انذار بالافراغ م23 وعدم الاداء داخل 15 يوم يفسخ العقد.</p><p>حرر في نظيرين. الامضاء مع المصادقة.</p>'});
D.push({t:"3- شكاية نصب - الفصل 540 - صياغة قانونية",c:"شكاية",h:'<h2>شكاية نصب واحتيال - الفصل 540 ق.ج</h2><p>الى السيد وكيل الملك ب: ____</p><p><b>المشتكي:</b> ____ الساكن ب ____</p><p><b>المشتكى به:</b> ____ الساكن ب ____</p><p><b>سلام تام بوجود مولانا الامام</b></p><p>حيث ان المشتكى به بتاريخ ____ اوهمني باستعمال وسائل احتيالية وتدليسية بانه يملك ____ وسيبيعه لي مقابل ____ درهم، حيث استعمل مناورات تدليسية توهم بوجود مشروع وهمي.</p><p>وحيث سلمته المبلغ نقدا/تحويل رقم ____</p><p>وحيث تبين ان المشروع لا وجود له وانه استعمل تلك الوسائل للحصول على مالي بغير حق.</p><p><b>وحيث ان الفصل 540 ق.ج ينص:</b> "يعاقب بالحبس من سنة الى خمس سنوات وغرامة من 500 الى 5000 درهم كل من استعمل الاحتيال او التدليس لحمل الغير على تسليم مال".</p><p><b>اركان الجريمة متوفرة:</b> استعمال وسائل احتيالية + تسليم المال + نية النصب.</p><p>لاجله التمس اجراء بحث واحالة المشتكى به على المحكمة.</p><p>المرفقات: نسخة بطاقة، اثبات التحويل.<br>الامضاء: ____</p>'});
var X=["وكالة خاصة بيع عقار محفظ","عقد بيع سيارة مع ضمان العيوب","التزام مصاريف السكن","التزام نفقة","عقد عمل CDD","عقد عمل CDI","طلب عمل","شكاية سرقة 505","خيانة امانة 547","تهديد","قسمة تركة","شراكة تجارية","كراء محل تجاري 49.16","انهاء كراء","بيع عقار","عدم التعرض","وكالة عامة","تنازل عن حق","استعطاف للعامل","كراء سيارة"];
for(var i=0;i<97;i++){var nm=(i+4)+"- "+X[i%X.length]+" - صياغة قانونية";D.push({t:nm,c:"متنوع",h:"<h2>"+nm+"</h2><p><b>الحمد لله وحده - صياغة قانونية احترافية</b></p><p>بتاريخ ____ بمدينة ____</p><p>الطرفان بكامل الاهلية طبقا للقانون المغربي، يلتزمان بما يلي طبقا للفصول المنظمة في مدونة الحقوق العينية والقانون المدني وقانون الالتزامات والعقود.</p><p>البند1 الموضوع - البند2 المدة والثمن - البند3 الالتزامات - البند4 شروط الفسخ طبقا للفصل 230 و231 ق.ل.ع - البند5 الاختصاص القضائي لمحكمة ____</p><p>الاسم: ____ البطاقة: ____ التوقيع مع المصادقة.</p>"});}
function R(){var q=document.getElementById('q').value.toLowerCase();var f=D.filter(function(x){return x.t.toLowerCase().includes(q)});var h="";for(var i=0;i<f.length;i++){var idx=D.indexOf(f[i]);h+='<div class=c><div><b>'+f[i].t+'</b><br><small style="background:#FFF0F0;color:#C1272D;padding:2px 8px;border-radius:10px">'+f[i].c+'</small></div><a class=b href=# onclick="O('+idx+');return false">فتح</a></div>'}document.getElementById('L').innerHTML=h}
function O(i){document.getElementById('P').innerHTML=D[i].h+'<br><br><button onclick="window.print()" style="width:100%;padding:14px;background:#C1272D;color:#fff;border:none;border-radius:12px">طباعة / PDF</button>';document.getElementById('V').style.display='block';window.scrollTo(0,0)}R();
