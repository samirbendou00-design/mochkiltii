const D=[
{t:"1- طلب توضيح مفهوم الطلاق - المواد 78-93 من مدونة الأسرة - مفصل جدا",c:"أسرة",h:`<h2 style="text-align:center">طلب توضيح مفهوم الطلاق طبقا لمدونة الأسرة</h2><p><b>المادة 78:</b> الطلاق حل ميثاق الزوجية، يمارسه الزوج والزوجة كل بحسب شروطه تحت مراقبة القضاء وطبقا لأحكام مدونة الأسرة.</p><p><b>الفرق بين الطلاق والتطليق:</b> الطلاق بيد الزوجين، التطليق تحكم به المحكمة بطلب أحد الزوجين (الشقاق، الضرر...).</p><p><b>أنواع الطلاق:</b> 1- رجعي: يمكن للزوج إرجاع زوجته داخل العدة بدون عقد جديد. 2- بائن بينونة صغرى: ينتهي به الزواج ولا رجعة إلا بعقد جديد. 3- بائن بينونة كبرى: بعد ثلاث طلقات لا تحل له حتى تنكح زوجا غيره.</p><p><b>مسطرة الطلاق في المغرب:</b> تقديم طلب الإذن بالإشهاد - استدعاء الزوجة - محاولة الصلح وجوبا - تحديد مستحقات الزوجة والأطفال - الإشهاد بالطلاق عند العدلين داخل أجل 15 يوم.</p><p>حرر بتاريخ: <input> الإسم: <input> التوقيع: <input></p>`},
{t:"2- عقد كراء شقة سكنية مفصل - القانون 67.12",c:"كراء",h:`<h2 style="text-align:center">عقد كراء شقة سكنية</h2><p>الطرف الأول المكري: السيد <input> الحامل لبطاقة رقم <input> الساكن ب <input></p><p>الطرف الثاني المكتري: السيد <input> الحامل لبطاقة رقم <input></p><p><b>البند 1 - موضوع الكراء:</b> شقة كائنة ب <input> الطابق <input> المساحة <input> م² تتكون من <input></p><p><b>البند 2 - المدة:</b> من <input> إلى <input> قابلة للتجديد باتفاق الطرفين.</p><p><b>البند 3 - الثمن:</b> <input> درهم شهريا يؤدي بداية كل شهر، مع تسبيق ضمان قدره <input> درهم.</p><p><b>البند 4 - التزامات المكتري:</b> المحافظة على العين، أداء فواتير الماء والكهرباء، عدم إحداث تغييرات جوهرية إلا بإذن كتابي، الإفراغ عند انتهاء المدة.</p><p><b>البند 5 - الفسخ:</b> في حالة عدم الأداء بعد إنذار 15 يوم يفسخ العقد طبقا للمادة 23 من قانون 67.12.</p><p>الإمضاءات مع المصادقة</p>`},
{t:"3- شكاية نصب واحتيال - الفصل 540 من القانون الجنائي",c:"شكاية",h:`<h2 style="text-align:center">شكاية نصب واحتيال طبقا للفصل 540 ق.ج</h2><p>إلى السيد وكيل الملك لدى المحكمة الابتدائية ب <input></p><p>المشتكي: <input> الساكن ب <input> رقم الهاتف <input></p><p>المشتكى به: <input> الساكن ب <input></p><p><b>الموضوع:</b> بتاريخ <input> تعرفت على المشتكى به الذي أوهمني أنه يملك <input> وأنه سيقوم ب <input> مقابل مبلغ <input> درهم، فسلمته المبلغ نقدا/تحويلا بنكيا، وبعد ذلك تبين أنه لا يتوفر على أي شيء وأنه استعمل وسائل احتيالية للحصول على المال.</p><p><b>النص القانوني:</b> الفصل 540 ق.ج يعاقب بالحبس من سنة إلى 5 سنوات وغرامة على كل من استعمل تدليسا للحصول على مال الغير.</p><p>لأجله ألتمس فتح بحث وإحالة المشتكى به على المحكمة.</p><p>المرفقات: نسخة بطاقة، إثبات تحويل، محادثات واتساب.</p>`}
];

function R(){let q=document.getElementById('q').value.toLowerCase();let f=D.filter(x=>x.t.toLowerCase().includes(q));document.getElementById('L').innerHTML=f.map(d=>`<div class=c><div><b>${d.t}</b><br><small style="background:#FFF0F0;color:#C1272D;padding:2px 8px;border-radius:10px">${d.c}</small></div><a class=b href=# onclick="O(${D.indexOf(d)});return false">فتح</a></div>`).join('')}
function O(i){document.getElementById('P').innerHTML=D[i].h+`<br><br><button class=btn pr onclick=window.print()>🖨️ طباعة / حفظ PDF</button>`;document.getElementById('V').style.display='block';window.scrollTo(0,0)}
