<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة 100 نموذج - A4 منظم</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Tajawal',sans-serif}
.a4{width:210mm;min-height:297mm;background:white;margin:auto;padding:20mm 20mm 15mm 20mm;box-shadow:0 0 20px rgba(0,0,0,0.1);font-family:'Amiri',serif;line-height:2;font-size:14px;color:#111}
@media print{.no-print{display:none!important}.a4{box-shadow:none;margin:0;padding:15mm;width:100%}}
input.field{border:none;border-bottom:1.5px dotted #C1272D;background:#fff8f8;min-width:120px;padding:2px 6px;font-family:'Tajawal';font-weight:700;color:#C1272D}
</style>
</head>
<body class="bg-[#f5f0f0]">
<div class="bg-[#C1272D] text-white p-4 sticky top-0 z-20 no-print"><div class="max-w-6xl mx-auto flex justify-between items-center"><div><h1 class="text-xl font-black">📄 مكتبة 100 نموذج - A4 منظم + فورم</h1><p class="text-[11px] opacity-90">عمر المعلومات الفارغة وطبع مباشرة A4</p></div><a href="index.html" class="bg-white text-[#C1272D] px-4 py-2 rounded-full text-xs font-bold">الرئيسية</a></div><input id="search" onkeyup="filterDocs()" placeholder="🔍 قلب: نصب، طلاق، كراء، بيع سيارة..." class="mt-3 w-full p-3 rounded-xl text-black text-sm max-w-6xl mx-auto block"></div>
<div class="max-w-6xl mx-auto p-4 no-print"><div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-2"></div></div>
<div id="modal" class="fixed inset-0 bg-black/70 hidden z-50 overflow-auto p-2 md:p-6 no-print">
<div class="max-w-5xl mx-auto w-full">
<div class="bg-white rounded-t-2xl p-4 flex justify-between items-center">
<h2 id="mT" class="font-black text-[#C1272D]"></h2>
<div class="flex gap-2"><button onclick="printA4()" class="bg-black text-white px-4 py-2 rounded-xl text-sm font-bold">🖨️ طباعة A4</button><button onclick="closeM()" class="bg-gray-100 w-8 h-8 rounded-full">✕</button></div>
</div>
<div class="bg-amber-50 border-x p-3 grid grid-cols-1 md:grid-cols-3 gap-2">
<input id="f_name" class="field border p-2 rounded" placeholder="الاسم الكامل">
<input id="f_cin" class="field border p-2 rounded" placeholder="رقم البطاقة الوطنية">
<input id="f_addr" class="field border p-2 rounded" placeholder="العنوان الكامل">
<input id="f_phone" class="field border p-2 rounded" placeholder="الهاتف">
<input id="f_city" class="field border p-2 rounded" placeholder="المدينة">
<input id="f_date" type="date" class="field border p-2 rounded">
<input id="f_other" class="field border p-2 rounded md:col-span-3" placeholder="اسم المشتكى به / الطرف الآخر + معلومات إضافية">
</div>
<div id="a4" class="a4"></div>
</div>
</div>
<script>
function gen(i){let t,c;if(i<=15){let titles=["النصب والاحتيال 540","السرقة 505","الضرب والجرح 400-401","التهديد 425","التشهير 447-2","خيانة الأمانة 547","شيك بدون رصيد 316","انتزاع عقار 570","السب والشتم 444","إهمال الأسرة 479","النصب العقاري","التزوير","الابتزاز","التهديد بالقتل","المس بالحياة الخاصة"];t=`شكاية ب${titles[i%15]} - نموذج ${i}`;c=(d)=>`<div style="text-align:left;font-size:11px">المدينة في: ${d.date}</div><div style="text-align:center;font-weight:900;font-size:18px;margin:10px 0">إلى السيد وكيل الملك لدى المحكمة الابتدائية بــــ ${d.city}</div><div style="font-weight:700;margin:15px 0">الموضوع: شكاية من أجل ${titles[i%15]}</div><div style="text-align:center">سلام تام بوجود مولانا الإمام</div><div style="margin-top:20px">يشرفني أنا الموقع أسفله:<br>- الاسم الكامل: ${d.name}<br>- ب.ت.و رقم: ${d.cin}<br>- الساكن بـ: ${d.addr}<br>- الهاتف: ${d.phone}<br><br>أن أتقدم بهذه الشكاية ضد:<br>- السيد(ة): ${d.other}<br><br>من أجل الوقائع التالية:<br>بتاريخ ${d.date} بمدينة ${d.city} وبالضبط بـ [المكان]، قام المشتكى به بـ [اكتب الوقائع بالتفصيل].<br><br>وحيث أن هذه الأفعال تشكل جنحة ${titles[i%15]}.<br><br>ألتمس: 1- فتح بحث 2- متابعته 3- حفظ حقي في التعويض<br><br>المرفقات: نسخة ب.ت.و + ما يثبت<br><br><div style="text-align:left">حرر بـ ${d.city} بتاريخ: ${d.date}<br>الإمضاء: ${d.name}</div></div>`;}else if(i<=35){let titles=["التطليق للشقاق م94","النفقة م187","الرجوع لبيت الزوجية","إسقاط الحضانة","حق الزيارة","ثبوت الزوجية","الإذن بالتعدد","إثبات النسب","الحضانة","الزيادة في النفقة"];t=`دعوى ${titles[i%10]} - نموذج ${i}`;c=(d)=>`<div style="text-align:left;font-size:11px">في: ${d.date}</div><div style="text-align:center;font-weight:900">إلى رئيس المحكمة الابتدائية - قسم قضاء الأسرة بــــ ${d.city}</div><div style="margin-top:15px">لفائدة: ${d.name} ب.ت.و ${d.cin}<br>ضد: ${d.other}</div><div style="font-weight:700;margin:15px 0">الموضوع: ${t}</div>أني متزوج(ة) منذ [التاريخ] بموجب عقد زواج رقم [الرقم]، رزقت بـ [الأبناء].<br>الحياة مستحيلة بسبب [الشقاق/عدم الإنفاق...] ${d.other}<br><br>ألتمس الحكم بـ ${titles[i%10]}<br><br><div style="text-align:left">حرر في ${d.city} بتاريخ ${d.date}<br>الإمضاء: ${d.name}</div>`;}else if(i<=55){t=`عقد كراء ${["سكني","تجاري","مهني","غرفة","أرض فلاحية"][i%5]} - نموذج ${i}`;c=(d)=>`<div style="text-align:center;font-weight:900;font-size:18px">عقد كراء ${["سكني","تجاري","مهني","غرفة","أرض"][i%5]}</div><div style="text-align:left;font-size:11px">بتاريخ: ${d.date} بمدينة ${d.city}</div><br>الطرف الأول - المالك: ${d.name} ب.ت.و ${d.cin} الساكن بـ ${d.addr}<br>الطرف الثاني - المكتري: ${d.other}<br><br>الفصل1- موضوع الكراء: ${["شقة","محل تجاري","مكتب","غرفة","أرض فلاحية"][i%5]} كائنة بـ ${d.addr}<br>الفصل2- المدة: من ${d.date} إلى [تاريخ النهاية]<br>الفصل3- السومة: [المبلغ] شهريا<br>الفصل4- الضمانة: [المبلغ]<br>الفصل5- التزامات المكتري: المحافظة، أداء الماء والكهرباء<br>الفصل6- فسخ: عدم أداء شهرين = فسخ بعد إنذار 15 يوم<br><br><div style="display:flex;justify-content:space-between;margin-top:30px"><div>إمضاء المالك:<br>${d.name}</div><div>إمضاء المكتري:<br>${d.other}</div></div>`;}else if(i<=80){let types=["بيع سيارة","بيع دراجة","وكالة عامة","وكالة خاصة","التزام بدين","اعتراف بدين","عقد شراكة","عقد عمل","التزام بالإفراغ","إبراء ذمة"];t=`${types[i%10]} - نموذج ${i}`;c=(d)=>`<div style="text-align:center;font-weight:900;font-size:18px">${types[i%10].toUpperCase()}</div><div style="text-align:left;font-size:11px">حرر في ${d.city} بتاريخ ${d.date}</div><br>أنا: ${d.name} ب.ت.و ${d.cin} الساكن بـ ${d.addr}<br><br>أصرح:<br>${d.other} - [اكتب التفاصيل: نوع السيارة، المبلغ، المدة...]<br><br>حرر في ${d.city} بتاريخ ${d.date}<br>الإمضاء: ${d.name}`;}else{t=`طلب ${["شهادة إدارية","رخصة إصلاح","عداد","تظلم","شكاية","استعطاف","نسخة حكم","فتح محل","CNSS","بناء عشوائي"][i%10]} - نموذج ${i}`;c=(d)=>`<div style="text-align:left;font-size:11px">في ${d.date}</div><div style="text-align:center;font-weight:900">إلى السيد: رئيس الجماعة/الباشا ب ${d.city}</div><div style="font-weight:700;margin:15px 0">الموضوع: ${t}</div>أنا: ${d.name} ب.ت.و ${d.cin} الساكن بـ ${d.addr}<br><br>أتقدم بهذا الطلب: ${d.other}<br><br>ألتمس قبول طلبي<br><br><div style="text-align:left">حرر في ${d.city} بتاريخ ${d.date}<br>الإمضاء: ${d.name}</div>`;}return [t,c];}
const docsData=Array.from({length:100},(_,i)=>gen(i+1));
let currentGen=null;const grid=document.getElementById('grid');
function render(list){grid.innerHTML="";list.forEach((d,i)=>{let div=document.createElement('div');div.className='bg-white p-4 rounded-2xl shadow-sm border hover:shadow-lg cursor-pointer';let cat=d[0].includes('شكاية')?'شكاية':d[0].includes('دعوى')?'أسرة':d[0].includes('كراء')?'كراء':d[0].includes('عقد')||d[0].includes('بيع')||d[0].includes('وكالة')?'عقود':'إداري';let color=cat=='شكاية'?'bg-red-100 text-red-700':cat=='أسرة'?'bg-purple-100 text-purple-700':cat=='كراء'?'bg-blue-100 text-blue-700':cat=='عقود'?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700';div.innerHTML=`<div><span class="text-[10px] ${color} px-2 py-1 rounded-full font-bold">${cat} - ${i+1}</span><h3 class="font-bold mt-2 text-[14px]">${d[0]}</h3></div><div class="mt-3 text-xs text-[#C1272D] font-bold">عمر المعلومات وطبع A4 ←</div>`;div.onclick=()=>openM(i);grid.appendChild(div)});}
function openM(idx){currentGen=docsData[idx];document.getElementById('mT').innerText=currentGen[0];document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex');updateA4();}
function closeM(){document.getElementById('modal').classList.add('hidden');}
function getData(){return{name:document.getElementById('f_name').value||'...........................',cin:document.getElementById('f_cin').value||'..................',addr:document.getElementById('f_addr').value||'........................................',phone:document.getElementById('f_phone').value||'..................',city:document.getElementById('f_city').value||'[المدينة]',date:document.getElementById('f_date').value||new Date().toLocaleDateString('ar-MA'),other:document.getElementById('f_other').value||'...........................'};}
function updateA4(){if(!currentGen)return;let d=getData();let html=currentGen[1](d);document.getElementById('a4').innerHTML=html;}
document.querySelectorAll('.field').forEach(el=>el.addEventListener('input',updateA4));
function printA4(){window.print();}
function filterDocs(){let q=document.getElementById('search').value.toLowerCase();let f=docsData.map((d,i)=>[d[0],d,i]).filter(x=>x[0].toLowerCase().includes(q));let list=f.map(x=>docsData[x[2]]);grid.innerHTML="";f.forEach(item=>{let idx=item[2];let d=docsData[idx];let div=document.createElement('div');div.className='bg-white p-4 rounded-2xl shadow-sm border hover:shadow-lg cursor-pointer';div.innerHTML=`<div><span class="text-[10px] bg-gray-100 px-2 py-1 rounded-full">${idx+1}</span><h3 class="font-bold mt-2 text-[14px]">${d[0]}</h3></div><div class="mt-3 text-xs text-[#C1272D] font-bold">عمر وطبع ←</div>`;div.onclick=()=>openM(idx);grid.appendChild(div)});if(q=="")render(docsData);}
render(docsData);
</script>
</body>
</html>
