<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة 100 نموذج كاتب عمومي</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif}pre{font-family:'Tajawal',sans-serif}</style>
</head>
<body class="bg-[#fdf6f6]">
<div class="bg-[#C1272D] text-white p-5 sticky top-0 z-20"><div class="max-w-6xl mx-auto"><h1 class="text-2xl font-black">📄 مكتبة 100 نموذج كاتب عمومي مفصل</h1><p class="text-xs mt-1">مكتوبة بحال عند كاتب عمومي - عمر [الفراغات]</p><input id="search" onkeyup="filterDocs()" placeholder="🔍 قلب: نصب، سرقة، طلاق، نفقة، كراء، بيع سيارة..." class="mt-3 w-full p-3 rounded-xl text-black text-sm"></div></div>
<div class="max-w-6xl mx-auto p-4"><div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-4"></div></div>
<div id="modal" class="fixed inset-0 bg-black/70 hidden items-start justify-center p-2 z-50 overflow-auto"><div class="bg-white rounded-2xl max-w-3xl w-full my-4 p-5 relative"><button onclick="closeM()" class="absolute left-4 top-4 bg-gray-100 w-8 h-8 rounded-full">X</button><h2 id="mT" class="font-black text-[#C1272D] text-lg ml-8"></h2><div class="mt-3 bg-amber-50 border p-3 rounded-xl text-[11px]">💡 عوض كل [قوس] بمعلوماتك. مصادقة 2 دراهم بالمقاطعة.</div><pre id="mC" class="whitespace-pre-wrap text-[13px] leading-7 bg-gray-50 p-4 rounded-xl border mt-3 max-h-[60vh] overflow-auto"></pre><div class="grid grid-cols-2 gap-2 mt-4"><button onclick="copyM()" class="bg-[#C1272D] text-white py-3 rounded-xl font-bold">📋 نسخ</button><button onclick="printM()" class="bg-black text-white py-3 rounded-xl font-bold">🖨️ طباعة</button></div></div></div>
<script>
function gen(i){
let t="",c="";
if(i<=15){
t=`شكاية ${["بالنصب 540","بالسرقة 505","بالضرب 400","بالتهديد 425","بالتشهير 447","بخيانة الامانة 547","شيك بدون رصيد 316","انتزاع عقار 570","سب وشتم 444","اهمال اسرة 479","نصب عقاري","تزوير","خيانة زوجية","ابتزاز","تهديد"][i%15]} - نموذج ${i}`;
c=`إلى السيد وكيل الملك لدى المحكمة الابتدائية بــــ [المدينة]\n\nالموضوع: ${t}\n\nسلام تام بوجود مولانا الإمام،\n\nأنا الموقع أسفله:\nالاسم الكامل: [الاسم الكامل]\nب.ت.و رقم: [رقم البطاقة]\nالساكن بـ: [العنوان الكامل بالتدقيق]\nالهاتف: [رقم الهاتف]\n\nأتقدم بشكاية ضد: [اسم المشتكى به] الساكن بـ [عنوانه]\n\nالوقائع:\nبتاريخ [التاريخ باليوم والشهر والسنة] على الساعة [الساعة] بمدينة [المدينة] وبالضبط بـ [المكان]، قام المشتكى به بـ [اكتب هنا الوقائع بالتفصيل: ماذا وقع، كم المبلغ، كيف سلمت، هل هناك شهود، ماذا قيل... اكتب القصة كاملة كأنك عند كاتب عمومي].\n\nوحيث أن هذه الأفعال تشكل جنحة ${t} المنصوص عليها في القانون الجنائي المغربي.\n\nألتمس:\n1- فتح بحث وتحقيق والاستماع للمشتكى به والشهود\n2- متابعته طبقا للقانون\n3- حفظ حقي في المطالبة بالتعويض المدني\n\nالمرفقات (إجبارية):\n- نسخة ب.ت.و مصادق عليها\n- وصل/تحويل بنكي/رسائل واتساب/شهادة طبية/صور حسب الموضوع\n- شهادة الشهود إن وجدت\n\nحرر بـ [المدينة] بتاريخ: [التاريخ]\nالإمضاء المصادق عليه: [الاسم الكامل]`;
}else if(i<=35){
t=`دعوى ${["التطليق للشقاق م94","النفقة م187","الرجوع لبيت الزوجية","إسقاط الحضانة","الزيارة","ثبوت الزوجية","الإذن بالتعدد","النسب","الحضانة","الزيادة في النفقة"][i%10]} - نموذج ${i}`;
c=`إلى السيد رئيس المحكمة الابتدائية - قسم قضاء الأسرة بــــ [المدينة]\n\nلفائدة: [الاسم الكامل] ب.ت.و [رقم] الساكن بـ [العنوان]\nضد: [اسم الطرف الآخر] الساكن بـ [العنوان]\n\nالموضوع: ${t}\n\nسلام تام،\nأعرض على هيئتكم الموقرة:\nأني متزوج(ة) بالمدعى عليه منذ [التاريخ] بموجب عقد زواج رقم [الرقم] صحيفة [رقم] عدلي [مدينة]، ورزقت منه بـ [عدد الأبناء: الأسماء وتواريخ الازدياد].\nوحيث أن الحياة الزوجية أصبحت مستحيلة بسبب [الشقاق المستمر والسب والشتم وعدم الإنفاق / امتناع الزوج عن الإنفاق رغم يساره حيث يشتغل [المهنة] بدخل [المبلغ] / خروج الزوجة بدون مبرر / إهمال المحضون [الاسم] وتعريضه للخطر / منع المحضون من زيارة أبيه].\nوحيث فشلت جميع محاولات الصلح العائلي عن طريق [الأهل والوسطاء].\nوحيث تنص المادة 94/187 من مدونة الأسرة على حق المتضرر.\nلأجله ألتمس من المحكمة:\n1- الحكم بـ ${t}\n2- تحديد مستحقاتي: نفقة العدة، المتعة، نفقة الأبناء قدرها [1500 درهم]، إرجاع الصداق\n3- تحميل المدعى عليه الصائر\nالمرفقات: عقد الزواج، عقود ازدياد الأبناء، نسخة ب.ت.و، ما يفيد الدخل\nحرر في [المدينة] بتاريخ: [التاريخ]\nالإمضاء: [الاسم]`;
}else if(i<=55){
t=`عقد كراء ${["سكني","تجاري","مهني","غرفة","أرض فلاحية"][i%5]} مفصل - نموذج ${i}`;
c=`عقد كراء ${["سكني","تجاري","مهني","غرفة","أرض فلاحية"][i%5]}\n\nبتاريخ: [اليوم/الشهر/السنة] بمدينة [المدينة]\n\nبين:\nالطرف الأول - المالك: [الاسم الكامل] ب.ت.و [الرقم] الساكن بـ [العنوان]\nالطرف الثاني - المكتري: [الاسم الكامل] ب.ت.و [الرقم] الساكن بـ [العنوان]\n\nاتفقا على ما يلي:\nالفصل1- موضوع الكراء: يكري الطرف الأول للثاني ${["شقة سكنية بالطابق [رقم] مساحتها [المساحة] تتكون من غرفتين وصالون ومطبخ وحمام كائنة بـ [العنوان]","محل تجاري كائن بـ [العنوان] مساحته [المساحة] مخصص لـ [نوع النشاط]","مكتب مهني كائن بـ [العنوان]","غرفة سكنية بـ [العنوان]","قطعة أرض فلاحية مساحتها [المساحة] الكائنة بدوار [الاسم]"][i%5]}\nالفصل2- المدة: من [التاريخ] إلى [التاريخ] قابلة للتجديد\nالفصل3- السومة الكرائية: [المبلغ بالأرقام والحروف: مثلا 1500 درهم - ألف وخمسمائة درهم] شهريا تؤدى كل يوم [5 من كل شهر] نقدا/تحويل بنكي\nالفصل4- الضمانة: مبلغ [المبلغ] كتسبيق يسترجع عند نهاية الكراء\nالفصل5- التزامات المكتري: المحافظة على العين، أداء الماء والكهرباء، عدم الكراء من الباطن إلا بإذن كتابي، الإصلاحات الصغرى على عاتقه\nالفصل6- فسخ العقد: في حالة عدم أداء واجب كراء شهرين متتاليين يعتبر العقد مفسوخا بعد إنذار 15 يوما\nحرر في نظيرين\nإمضاء المالك: [الاسم] - إمضاء المكتري: [الاسم]\nالمصادقة على الإمضاء بالمقاطعة`;
}else if(i<=80){
let types=["بيع سيارة مفصل","بيع دراجة نارية","وكالة عامة مطلقة","وكالة خاصة لبيع سيارة","التزام بدين","اعتراف بدين","عقد شراكة","عقد عمل","التزام بالإفراغ","إبراء ذمة"];
t=`${types[i%10]} - نموذج ${i}`;
c=`${types[i%10].toUpperCase()}\n\nأنا الموقع أسفله:\nالاسم: [الاسم الكامل] ب.ت.و [الرقم] الساكن بـ [العنوان]\n\nأصرح وأنا بكامل قواي العقلية وأشهد على نفسي شهادة الطوع والرضا:\n\n${[
`أني بعت وأسقطت من ملكي لفائدة السيد [اسم المشتري] ب.ت.و [رقم] السيارة نوع [داسيا لوغان] رقم التسجيل [رقم اللوحة] رقم الإطار [رقم] لونها [اللون] موديل [السنة] بثمن قدره [المبلغ بالأرقام والحروف] قبضته كاملا ونقدا، والسيارة خالية من أي حجز أو رهن، وألتزم بتسليم الوثائق والتوقيع لدى المقاطعة.`,
`بعت دراجة نارية نوع [النوع] رقم الإطار [رقم] بثمن [المبلغ] للمشتري [الاسم]...`,
`وكلت عني السيد [الاسم] ب.ت.و [رقم] ليقوم مقامي وينوب عني في جميع الإدارات والمؤسسات العمومية والخصوصية والبنوك والمحاكم لسحب الوثائق والتوقيع نيابة عني وبيع وشراء وتمثيلي أمام جميع الجهات، وهذه الوكالة عامة مطلقة.`,
`وكلت السيد [الاسم] ب.ت.و [رقم] لبيع سيارتي رقم [رقم] والتوقيع نيابة عني لدى مصلحة النقل وتسليم البطاقة الرمادية.`,
`ألتزم بأداء مبلغ [المبلغ بالحروف] لفائدة السيد [الاسم] في أجل أقصاه [التاريخ] وأتحمل المسؤولية القانونية في حالة الإخلال، وألتزم بالأداء على دفعات شهرية قدرها [المبلغ] كل يوم [التاريخ].`,
`أعترف أني مدين للسيد [الاسم] ب.ت.و [رقم] بمبلغ [المبلغ] مقابل [سلف/بضاعة] تسلمته نقدا بتاريخ [التاريخ] وألتزم بأدائه كاملا في أجل [التاريخ].`,
`اتفقنا نحن [الطرف1: الاسم] و[الطرف2: الاسم] على تأسيس شراكة لتسيير مشروع [نوع المشروع: مقهى/محل ملابس] الكائن بـ [العنوان]، رأس المال [المبلغ]، حصة كل طرف [النسبة]، الأرباح والخسائر بالتساوي، مدة الشراكة [المدة]، وكل نزاع يحل وديا وإلا أمام محاكم [المدينة].`,
`عقد عمل بين شركة [اسم الشركة] في شخص ممثلها [الاسم] وبين الأجير [الاسم] ب.ت.و [رقم] للعمل كـ [المهنة: سائق/نادل/حارس] بأجر شهري صافي قدره [المبلغ] لمدة [6 أشهر/غير محددة] ابتداء من [التاريخ]، مكان العمل [العنوان]، ساعات العمل [من كذا إلى كذا]، مع التصريح في الضمان الاجتماعي.`,
`ألتزم بإفراغ المحل/الشقة الكائنة بـ [العنوان] بتاريخ [التاريخ] بدون قيد أو شرط وتسليم المفاتيح للمالك في حالة جيدة.`,
`أبرئ ذمة السيد [الاسم] من مبلغ [المبلغ] بعد توصلي به كاملا نقدا وعدا، ولا يبقى له بذمتي أي شيء، وهذا إبراء تام.`
][i%10]}\n\nوعليه حرر هذا العقد للعمل به عند الحاجة.\n\nحرر بـ [المدينة] بتاريخ: [التاريخ]\nالإمضاء المصادق عليه: [الاسم الكامل]`;
}else{
t=`طلب ${["شهادة إدارية","رخصة إصلاح","عداد ماء وكهرباء","تظلم إداري","شكاية للجماعة","استعطاف","نسخة حكم","فتح محل تجاري","التصريح في CNSS","تدخل ضد بناء عشوائي"][i%10]} - نموذج ${i}`;
c=`إلى السيد: ${["رئيس الجماعة الترابية لـ [المدينة]","عامل عمالة [الاسم]","مدير الوكالة للماء والكهرباء","المدير الإقليمي للتعليم","المحافظ العقاري","باشا مدينة [المدينة]","رئيس المحكمة","رئيس الجماعة","مدير CNSS","باشا المدينة"][i%10]}\n\nالموضوع: ${t}\n\nسلام تام بوجود مولانا الإمام،\n\nيشرفني أنا:\nالاسم الكامل: [الاسم]\nب.ت.و: [الرقم]\nالساكن بـ: [العنوان الكامل]\nالهاتف: [رقم]\n\nأن أتقدم بهذا الطلب وأعرض ما يلي:\nحيث أنني ${["أقطن بالعنوان أعلاه منذ [عدد السنوات] وأحتاج شهادة إدارية تثبت السكنى وعدم العمل لأجل [الزواج/الدعم/البطاقة الوطنية] وأتوفر على شهود وعقد كراء","أملك منزلا كائنا بـ [العنوان] وأرغب في القيام بإصلاحات [بناء حائط/صباغة/إصلاح سقف] وألتزم باحترام التصميم","تفاجأت بقطع الماء/الكهرباء عن منزلي رقم العداد [رقم] بدون سابق إنذار رغم أدائي لجميع الفواتير المرفقة وألتمس إرجاعه","تعرضت لقرار إداري رقم [الرقم] بتاريخ [التاريخ] يقضي بـ [القرار] وألتمس إعادة النظر نظرا لـ [الأسباب]","أتعرض لضرر من طرف جاري [الاسم] الذي قام بـ [بناء عشوائي/رمي الأزبال/احتلال الملك العمومي] مما يضر بصحتي وراحتي","تعرضت لغرامة/حكم قاس وألتمس التخفيف نظرا لظروفي الاجتماعية [أب لعدد أطفال/عاطل/مريض]","أحتاج نسخة من الحكم رقم [رقم] الصادر بتاريخ [تاريخ] في الملف رقم [رقم]","أرغب في فتح محل لبيع [المواد] كائن بـ [العنوان] وألتزم بالقوانين","اشتغلت لدى شركة [الاسم] من [التاريخ] إلى [التاريخ] ولم يصرح بي المشغل في CNSS رغم اقتطاعه","أتعرض لضرر من بناء عشوائي قام به جاري [الاسم] سد نافذتي ومنع التهوية"][i%10]}.\n\nلأجل ذلك ألتمس منكم التفضل بقبول طلبي واتخاذ المتعين طبق القانون.\nوتفضلوا بقبول فائق الاحترام.\nالمرفقات:\n- نسخة ب.ت.و\n- ${["عقد كراء + التزام الشهود","تصميم الإصلاح + صور","آخر فاتورة أداء","قرار الإدارة + وثائق تثبت العكس","صور الضرر + شهادة الشهود","شهادة الاحتياج/طبية","نسخة الحكم القديم إن وجدت","عقد الكراء للمحل","شهادة العمل + تصريح الشهود","صور الضرر + شهادة الشهود"][i%10]}\nحرر في [المدينة] بتاريخ: [التاريخ]\nالإمضاء: [الاسم]`;
}
return [t,c];
}
const docsData=Array.from({length:100},(_,i)=>gen(i+1));
let cur="";const grid=document.getElementById('grid');
function render(list){grid.innerHTML="";list.forEach((d,i)=>{let div=document.createElement('div');div.className='bg-white p-4 rounded-2xl shadow-sm border hover:shadow-lg cursor-pointer';let cat=d[0].includes('شكاية')?'شكاية':d[0].includes('دعوى')||d[0].includes('التطليق')||d[0].includes('النفقة')?'أسرة':d[0].includes('كراء')?'كراء':d[0].includes('عقد')||d[0].includes('وكالة')||d[0].includes('بيع')||d[0].includes('التزام')?'عقود':'إداري';let color=cat=='شكاية'?'bg-red-100 text-red-700':cat=='أسرة'?'bg-purple-100 text-purple-700':cat=='كراء'?'bg-blue-100 text-blue-700':cat=='عقود'?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700';div.innerHTML=`<div><span class="text-[10px] ${color} px-2 py-1 rounded-full font-bold">${cat} - ${i+1}</span><h3 class="font-bold mt-2 text-[14px]">${d[0]}</h3><p class="text-[11px] text-gray-400 mt-2">${d[1].substring(0,90)}...</p></div><div class="mt-3 text-xs text-[#C1272D] font-bold">افتح النموذج ←</div>`;div.onclick=()=>openM(d[0],d[1]);grid.appendChild(div)});}
function openM(t,c){cur=c;document.getElementById('mT').innerText=t;document.getElementById('mC').innerText=c;document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex');}
function closeM(){document.getElementById('modal').classList.add('hidden');}
function copyM(){navigator.clipboard.writeText(cur).then(()=>alert('✅ تم النسخ - دابا لصقو فـ Word')); }
function printM(){let w=window.open();w.document.write('<html dir=rtl><head><meta charset=utf-8><style>body{font-family:Tajawal,Arial;padding:30px;line-height:2.2}pre{white-space:pre-wrap;font-family:Tajawal,Arial}</style></head><body><pre>'+cur+'</pre></body></html>');w.document.close();w.print();}
function filterDocs(){let q=document.getElementById('search').value.toLowerCase();let f=docsData.filter(d=>d[0].toLowerCase().includes(q)||d[1].toLowerCase().includes(q));render(f);}
render(docsData);
</script>
</body>
</html>
