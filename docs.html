function applyData(template, d){
return template.replaceAll('{{name}}', d.name).replaceAll('{{cin}}', d.cin).replaceAll('{{addr}}', d.addr).replaceAll('{{phone}}', d.phone).replaceAll('{{city}}', d.city).replaceAll('{{date}}', d.date).replaceAll('{{other}}', d.other);
}
const docsData=rawData;
let curIdx=0;
const grid=document.getElementById('grid');
function render(list){
grid.innerHTML="";
list.forEach((item)=>{
let i=item[2];
let d=docsData[i];
let div=document.createElement('div');
div.className='bg-white p-4 rounded-2xl shadow-sm border hover:shadow-lg cursor-pointer';
let cat=d[0].includes('شكاية')?'شكاية':d[0].includes('دعوى')?'أسرة':d[0].includes('كراء')?'كراء':d[0].includes('عقد')||d[0].includes('بيع')||d[0].includes('وكالة')||d[0].includes('التزام')||d[0].includes('إبراء')?'عقود':'إداري';
let color=cat=='شكاية'?'bg-red-100 text-red-700':cat=='أسرة'?'bg-purple-100 text-purple-700':cat=='كراء'?'bg-blue-100 text-blue-700':cat=='عقود'?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700';
div.innerHTML=`<div><span class="text-[10px] ${color} px-2 py-1 rounded-full font-bold">${cat} - ${i+1}</span><h3 class="font-bold mt-2 text-[13px]">${d[0]}</h3><p class="text-[11px] text-gray-500 mt-1 line-clamp-2">${d[1].substring(0,80)}...</p></div><div class="mt-3 text-xs text-[#C1272D] font-bold">عمر وطبع A4 ←</div>`;
div.onclick=()=>openM(i);
grid.appendChild(div);
});
}
function openM(idx){
curIdx=idx;

document.getElementById('modal').classList.remove('hidden');
document.getElementById('modal').classList.add('flex');
updateA4();
}
function closeM(){document.getElementById('modal').classList.add('hidden');}
function getData(){
return {
name: document.getElementById('f_name').value || '...........................',
cin: document.getElementById('f_cin').value || '..................',
addr: document.getElementById('f_addr').value || '........................................',
phone: document.getElementById('f_phone').value || '..................',
city: document.getElementById('f_city').value || '[المدينة]',
date: document.getElementById('f_date').value || new Date().toLocaleDateString('ar-MA'),
other: document.getElementById('f_other').value || '...........................'
};
}
function updateA4(){
let d=getData();
let html=applyData(docsData[curIdx][1], d);
document.getElementById('a4').innerText=html;
}
document.querySelectorAll('.field').forEach(el=>el.addEventListener('input',updateA4));
function printA4(){window.print();}
function filterDocs(){
let q=document.getElementById('search').value.toLowerCase();
let filtered=docsData.map((d,i)=>[d[0],d[1],i]).filter(x=>x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));
grid.innerHTML="";
filtered.forEach(item=>{
let idx=item[2];
let d=docsData[idx];
let div=document.createElement('div');
div.className='bg-white p-4 rounded-2xl shadow-sm border hover:shadow-lg cursor-pointer';

grid.appendChild(div);
});

}
