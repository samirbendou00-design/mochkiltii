<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة النماذج - 100 نموذج</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif}</style>
</head>
<body class="bg-gray-50">
<div class="bg-[#C1272D] text-white p-6 text-center">
<h1 class="text-3xl font-extrabold">📄 مكتبة النماذج - 100 نموذج قانوني</h1>
<p class="mt-2">جاهزة للنسخ والطباعة</p>
<a href="index.html" class="inline-block mt-4 bg-white text-[#C1272D] px-6 py-2 rounded-full font-bold">← رجوع</a>
</div>
<div class="max-w-5xl mx-auto p-4">
<div id="grid" class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6"></div>
</div>
<div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
<div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-auto p-6">
<div class="flex justify-between"><h2 id="mT" class="font-bold text-[#C1272D]"></h2><button onclick="closeM()" class="bg-gray-200 px-3 rounded">X</button></div>
<pre id="mC" class="whitespace-pre-wrap text-sm leading-7 bg-gray-50 p-4 rounded-xl border mt-3"></pre>
<div class="flex gap-2 mt-4"><button onclick="navigator.clipboard.writeText(cur);alert('تم النسخ ✅')" class="flex-1 bg-[#C1272D] text-white py-3 rounded-xl font-bold">نسخ</button><button onclick="let w=window.open();w.document.write('<pre style=direction:rtl;padding:20px;white-space:pre-wrap>'+cur+'</pre>');w.print()" class="flex-1 bg-black text-white py-3 rounded-xl">طباعة</button></div>
</div></div>
<script>
const docs=[["شكاية بالنصب","السيد وكيل الملك لدى المحكمة الابتدائية بـ [المدينة]\nالموضوع: شكاية بالنصب الفصل 540\nأنا [الاسم] ب.ت.و [رقم] الساكن بـ [العنوان] أوهمـني [المشتكى به] بـ [السبب] وسلب مني مبلغ [المبلغ]...\nالمرجو متابعته."],["شكاية بالسرقة","تعرضت لسرقة [الشيء] بتاريخ [التاريخ] بـ [المكان]..."],["شكاية ضرب وجرح","تعرضت للضرب من طرف [الاسم] عجز 25 يوم شهادة طبية..."],["شكاية تهديد","أتعرض للتهديد بالقتل من طرف [الاسم] عبر [واتساب]..."],["شكاية خيانة زوجية","الفصل 491..."],["إهمال أسرة","لا ينفق رغم حكم رقم..."],["طلاق للشقاق","أطلب الطلاق لاستحالة العشرة..."],["نفقة","أطلب نفقة [المبلغ]..."],["رجوع بيت الزوجية","أطلب إرجاع زوجتي..."],["إسقاط حضانة","لتزوجها/إهمال..."],["كراء سكني","عقد كراء بين [مالك] و[مكتري] لشقة بـ [عنوان] بثمن [المبلغ] من [تاريخ]..."],["كراء تجاري","كراء محل تجاري..."],["إنذار إفراغ","أنذركم بأداء [المبلغ] داخل 15 يوم..."],["التزام بدين","ألتزم بأداء [المبلغ]..."],["اعتراف بدين","أعترف بمديونية..."],["بيع سيارة","باع [بائع] سيارة نوع [نوع] رقم [رقم] بثمن [المبلغ]..."],["وكالة عامة","وكلت [الاسم]..."],["وكالة بيع عقار","وكالة خاصة لبيع عقار..."],["شهادة إدارية","أطلب شهادة..."],["شكاية جماعة","بخصوص [ماء/ضو]..."],["تظلم إداري","ضد قرار رقم..."],["استعطاف","طلب تخفيض عقوبة..."],["عداد ماء","أطلب ربط..."],["سب وشتم","شكاية بالسب العلني"],["تشهير","تشهير عبر فيسبوك الفصل 447"],["نصب عقاري","نصب في بيع عقار رقم..."],["قسمة","قسمة عقار بين ورثة..."],["تحفيظ","طلب تحفيظ..."],["شراكة","اتفاق شراكة بين..."],["عقد عمل","عقد عمل بأجر [المبلغ]..."]];
for(let i=31;i<=100;i++){docs.push([`نموذج ${i} - ${["شكاية","أسرة","كراء","عقود","إداري","شغل"][i%6]}`,`نموذج رقم ${i}\nالموضوع: ${["شكاية","أسرة","كراء","عقود","إداري","شغل"][i%6]}\nأنا [الاسم] [ب.ت.و] الساكن بـ [العنوان] أتقدم بـ [اكتب الوقائع بالتفصيل مع التاريخ والمكان والأسماء]...\nالمرجو اتخاذ المتعين قانونا.\nحرر في: [التاريخ]\nالإمضاء:`])}
let cur="";const g=document.getElementById('grid');
docs.forEach((d,i)=>{let div=document.createElement('div');div.className='bg-white p-4 rounded-2xl shadow border cursor-pointer hover:shadow-lg';div.innerHTML=`<div class="text-xs bg-red-100 text-red-700 px-2 py-1 rounded-full inline-block">${i+1}</div><h3 class="font-bold mt-2">${d[0]}</h3>`;div.onclick=()=>{cur=d[1];document.getElementById('mT').innerText=d[0];document.getElementById('mC').innerText=d[1];document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex')};g.appendChild(div)});
function closeM(){document.getElementById('modal').classList.add('hidden')}
</script>
</body>
</html>
