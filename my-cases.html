<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قضاياي - مشكلتي</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:'Segoe UI',Tahoma}</style>
</head>
<body class="bg-[#f5f5f0] min-h-screen p-4">
<div class="max-w-3xl mx-auto">
<div class="flex justify-between items-center mb-6 bg-[#006233] text-white p-5 rounded-2xl shadow-lg">
<h1 class="font-black text-xl">💾 قضاياي - حساب الآجال</h1>
<a href="index.html" class="bg-white text-[#006233] px-5 py-2 rounded-xl font-black text-sm">← رجوع للرئيسية</a>
</div>

<div id="casesList" class="grid gap-4"></div>
<div id="empty" class="hidden bg-white p-10 rounded-2xl text-center shadow">
<p class="text-4xl mb-3">📂</p>
<p class="font-bold">ما كاين حتى قضية محفوظة</p>
<p class="text-sm text-gray-500 mt-2">سير للرئيسية، حل شي مشكل، ودير حفظ في قضاياي</p>
</div>
</div>

<script>
const list=document.getElementById('casesList');
const empty=document.getElementById('empty');
let cases=JSON.parse(localStorage.getItem('moch_myCases')||'[]');

if(cases.length===0){
 empty.classList.remove('hidden');
}else{
 cases.forEach(c=>{
  const now=Date.now();
  const diff=Math.ceil((c.deadlineTime-now)/(1000*60*60*24));
  let color='bg-green-100 text-green-800 border-green-500';
  let status=`باقي ${diff} يوم`;
  if(diff<=0){color='bg-red-600 text-white border-red-700 animate-pulse'; status='⛔ انتهى الأجل!';}
  else if(diff<=3){color='bg-red-100 text-red-800 border-red-500'; status=`⚠️ باقي ${diff} أيام فقط!`;}
  else if(diff<=7){color='bg-orange-100 text-orange-800 border-orange-500'; status=`⏰ باقي ${diff} أيام`;}

  const div=document.createElement('div');
  div.className=`bg-white p-5 rounded-2xl shadow border-r-8 ${color.split(' ')[2]||'border-[#006233]'}`;
  div.innerHTML=`
   <div class="flex justify-between items-start gap-2">
    <div class="flex-1">
     <h3 class="font-black text-[#006233]">${c.title||'قضية'}</h3>
     <p class="text-xs text-gray-500 mt-1">👤 ${c.name||'بدون اسم'} | 📅 حفظ: ${c.startDate} | ⏰ الأجل: ${c.deadlineDate} (${c.deadlineDays} يوم)</p>
     <p class="text-sm text-gray-700 mt-2 bg-gray-50 p-2 rounded-lg">${c.problem||''}</p>
    </div>
    <span class="px-3 py-1 rounded-full text-xs font-black ${color} border">${status}</span>
   </div>
   <div class="flex gap-2 mt-4">
    <button onclick="shareCase(${c.id})" class="flex-1 bg-[#25D366] text-white py-2 rounded-xl text-xs font-black">📤 واتساب</button>
    <button onclick="deleteCase(${c.id})" class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-xl text-xs font-bold">🗑️ مسح</button>
   </div>
  `;
  list.appendChild(div);
 });
}

function deleteCase(id){
 if(!confirm('واش بغيتي تمسح هاد القضية؟')) return;
 cases=cases.filter(x=>x.id!==id);
 localStorage.setItem('moch_myCases',JSON.stringify(cases));
 location.reload();
}
function shareCase(id){
 const c=cases.find(x=>x.id===id);
 if(!c) return;
 const msg=`قضيتي: ${c.title}\nالأجل: ${c.deadlineDate} (باقي ${Math.ceil((c.deadlineTime-Date.now())/(1000*60*60*24))} يوم)\nالمشكل: ${c.problem}`;
 window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}
</script>
</body>
</html>
